<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>djazair.dev · Growing Algeria’s developer ecosystem</title>
<meta name="description" content="The Algeria Developer Index and an open-source Project Hub, in Arabic, French and English. Coming soon.">
<meta name="theme-color" content="#0E1A15">
<meta property="og:type" content="website">
<meta property="og:url" content="https://djazair.dev/">
<meta property="og:title" content="djazair.dev">
<meta property="og:description" content="Growing Algeria’s developer ecosystem">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap">
<style>
  :root {
    --night: #0E1A15;
    --ink: #EEF3EC;
    --mint: #3DBE84;
    --muted: rgba(238, 243, 236, .72);
    --faint: rgba(238, 243, 236, .5);
    --rule: rgba(238, 243, 236, .16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--night);
    color: var(--ink);
    font-family: 'Tajawal', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 16px;
    text-align: center;
  }
  .mark { width: 160px; height: 160px; }
  h1 {
    margin: 28px 0 10px;
    font-size: clamp(44px, 9vw, 72px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  h1 span { color: var(--mint); }
  .tagline { margin: 0; font-size: clamp(18px, 3.4vw, 22px); font-weight: 500; color: var(--muted); }
  .status { max-width: 30em; margin: 40px 0 0; font-size: 17px; line-height: 1.55; }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
  .links a {
    padding: 10px 18px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    color: var(--ink);
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
  }
  .links a:hover, .links a:focus-visible { border-color: var(--mint); color: var(--mint); }
  footer { padding: 20px 16px 28px; font-size: 13px; color: var(--faint); text-align: center; }
</style>
</head>
<body>
<main>
  <img class="mark" src="mark.svg" width="160" height="160" alt="">
  <h1>djazair<span>.dev</span></h1>
  <p class="tagline">Growing Algeria’s developer ecosystem</p>
  <p class="status">Coming soon: the Algeria Developer Index and an open-source Project Hub, in Arabic, French and English.</p>
  <div class="links">
    <a href="https://github.com/djazairdev">Follow on GitHub</a>
    <a href="mailto:contact@djazair.dev">contact@djazair.dev</a>
  </div>
</main>
<footer>An independent community project, not affiliated with GitHub.</footer>
</body>
</html>
