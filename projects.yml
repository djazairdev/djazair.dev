# Example entry:
#
#   - repository: owner/name
#     category: library            # app, library, tool or dataset
#     tags: [arabic, payments]     # how the project relates to Algeria (list in CONTRIBUTING.md)
#     maintainer_pledge: true      # maintainers reply to newcomer pull requests within 7 days
#     added: 2026-10-06

projects: []
