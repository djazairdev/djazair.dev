# yaml-language-server: $schema=hub/projects.schema.json
#
# Project Hub registry (PRD HUB-01). Add your project at the end of the list by pull request,
# or use the issue form; see CONTRIBUTING.md. CI checks every entry against
# hub/projects.schema.json (python3 -m hub check-registry).
#
# Language, licence and activity are read from GitHub, so don't add them here.
#
# Example entry:
#
#   - repository: owner/name
#     category: library            # app, library, tool or dataset
#     tags: [arabic, payments]     # how the project relates to Algeria (list in CONTRIBUTING.md)
#     maintainer_pledge: true      # maintainers reply to newcomer pull requests within 7 days
#     added: 2026-10-06

projects:
  - repository: djazairdev/djazair.dev
    category: tool
    tags: [community, open-data, arabic]
    maintainer_pledge: true
    added: 2026-10-06
  - repository: djazairdev/wilayas
    category: dataset
    tags: [open-data, public-services, maps]
    maintainer_pledge: true
    added: 2026-10-10
  - repository: djazairdev/detent
    category: tool
    tags: [algerian-maintainers]
    maintainer_pledge: true
    added: 2026-10-10
  - repository: djazairdev/founders.coffee
    category: app
    tags: [community, arabic]
    maintainer_pledge: true
    added: 2026-10-10
  - repository: djazairdev/minhajna
    category: app
    tags: [education, arabic]
    maintainer_pledge: true
    added: 2026-10-10
