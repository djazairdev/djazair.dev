name: Bug
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting it. For a security problem, don't use this form: follow the security policy instead."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: "What you did, what you expected, and what happened instead. Paste any error message as text."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: "The smallest steps, command or code that shows the problem."
      placeholder: |
        1. …
        2. …
  - type: input
    id: version
    attributes:
      label: Version
      description: "The version, release or commit you used, and your system or browser if it matters."
