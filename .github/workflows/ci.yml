# Tests, builds and deploys the site. A deploy runs only after every test and the build pass,
# so a failing change never replaces the last good site (PRD §11). The Data and Hub sync
# workflows start it by hand (workflow_dispatch), because what they push triggers no workflow.
# The build adds the Hub snapshot from the hub-data branch (hub/README.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check syntax
        run: python -m compileall -q site pipeline hub tests
      - name: Check the Hub registry
        run: python -m hub check-registry
      - name: Run the tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build the site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Add the Hub snapshot
        run: .github/scripts/hub-snapshot.sh
      - name: Build
        run: python site/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/dist
          retention-days: 7

  # Load times in Chrome, throttled like Lighthouse's mobile preset (site/perf.py,
  # docs/performance.md). Fails when a page is over 300 KB or the Overview's LCP is over 2.5 s;
  # it doesn't hold up deploys.
  performance:
    name: Measure load times
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site/dist
      - name: Let Chrome use its sandbox
        # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Measure
        run: python site/perf.py --runs 3

  # Deploys need the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and the
  # CLOUDFLARE_PAGES_PROJECT variable (docs/deploy.md). Until they exist, deploys are skipped.
  deploy-settings:
    name: Check deploy settings
    needs: build
    # main (pushed, or started by hand) deploys to production; pull requests from this
    # repository deploy a preview; anything else only tests and builds.
    if: >-
      github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && [ -n "$PROJECT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: Cloudflare settings are not configured yet (see docs/deploy.md)."
          fi

  deploy:
    name: Deploy to Cloudflare Pages
    needs: deploy-settings
    if: needs.deploy-settings.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name != 'pull_request' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site/dist
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site/dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.event_name != 'pull_request' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
            --commit-hash=${{ github.sha }}
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"
