# Throwaway probe: can the workflow token approve CI held on a pull request it opened? Never merged.
name: Data
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Open a pull request as the bot, approve its CI, clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c probe/bot-pr-head
          git commit -q --allow-empty -m 'Probe: never merge'
          git push -q --force origin HEAD:refs/heads/probe/bot-pr-head
          sha="$(git rev-parse HEAD)"
          url="$(gh pr create --base main --head probe/bot-pr-head --title 'Probe: never merge (closes itself)' --body 'A one-minute test that the data workflow can approve its own CI. It closes itself.')"
          pr="${url##*/}"
          id=''
          for _ in $(seq 1 18); do
            sleep 10
            id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&event=pull_request" --jq '.workflow_runs[] | select(.name=="CI") | "\(.id) \(.status) \(.conclusion)"' | head -1)"
            echo "seen: ${id}"
            case "$id" in *action_required*) break;; esac
          done
          run="${id%% *}"
          echo "APPROVE:"
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/approve"; then echo "APPROVE_OK"; else echo "APPROVE_REFUSED"; fi
          sleep 8
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '"after: \(.status) \(.conclusion) attempt=\(.run_attempt)"' || true
          gh run cancel "$run" || true
          gh pr close "$pr" --delete-branch || true
